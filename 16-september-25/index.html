    <style>
        img{
            width: 100%;
            height: 45vh;
        }
        .modal{
            z-index: 99;
            background-color: aqua;
            width: 50%;
            display: none;
            height: 70vh;
            position: fixed;
            box-shadow: 2px 2px 10px 2px black;
            border-radius: 10px;
            transform: translate(-50%, -50%);
            background-color: rgba(0,0,0,0.6);
            left: 50%;
            top: 50%;
        }
        .close{
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            background-color: red;
            color: white;
            border: none;
        }
        .close:hover{
            cursor: pointer;
            color: rgb(0, 0, 0);
            transform: scale(1.1);
            font-weight: bold;
        }
        .modal-content{
            width: 90%;
            height: 60vh;
            display: flex;
            justify-content: left;
            align-items: center;
            background: #fff;
            margin: auto;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            position: relative;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0px 8px 16px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-60%); }
            to   { opacity: 1; transform: translateY(-50%); }
        }
        .card-body {
    display: flex;

.card-text p {

}



.card-img img {
    width: 200px;  /* atur lebar gambar */
    border-radius: 8px;
}

.card-text {
    flex: 1;
}

    <script>
    let modal = document.getElementById('myModal');
    let span = document.getElementsByClassName('close')[0];

    let modalImg = modal.querySelector("img");
    let modalTitle = modal.querySelector("h3");
    let modalDesc = modal.querySelectorAll("p");

    btn.onclick = function(){
        modal.style.display = "block";
        modalImg.src = "gambar1.jpg";
        modalTitle.textContent = "Nama : The Conjuring";
        modalDesc[0].textContent = "The Conjuring: Last Rites menceritakan kasus nyata keluarga Smurl di Pennsylvania yang diteror empat entitas gaib, termasuk satu iblis kuat. Ed dan Lorraine Warren dipanggil untuk menyelidiki, sambil menghadapi dilema pribadi soal pensiun dari dunia paranormal. Film ini jadi penutup kisah pasangan Warren dalam semesta The Conjuring.";
        modalDesc[1].textContent = "Rilis September 2025.";
    }

    btn1.onclick = function(){
        modal.style.display = "block";
        modalImg.src = "gambar2.jpeg";
        modalTitle.textContent = "Nama : Exit 8";
        modalDesc[0].textContent = "Seorang pria — “The Lost Man” — terperangkap di sebuah lorong bawah tanah stasiun kereta bawah tanah Tokyo yang tampak tak berujung. Untuk bisa keluar lewat Exit 8, ia harus mengikuti satu aturan: jika dia melihat sesuatu yang aneh (“anomaly”), harus berbalik; jika tidak ada, dia boleh maju. Tapi satu kesalahan kecil saja bisa mengirimnya kembali ke awal.";
        modalDesc[1].textContent = "Rilis Mei 2025.";
    }

    btn3.onclick = function(){

        modalDesc[0].textContent = "The Long Walk mengisahkan 100 remaja laki-laki di Amerika distopia yang dipaksa ikut lomba jalan kaki tanpa henti; siapa pun yang berhenti atau melambat akan langsung dieksekusi. Tokoh utama, Ray Garraty, berjuang melawan rasa sakit, putus asa, dan persaingan kejam, sambil menemukan persahabatan serta makna hidup di tengah perjalanan mematikan ini.";
