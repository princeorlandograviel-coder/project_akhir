<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="img/invisible-man.png" type="image/x-icon">
</head>
    <style>
        #carousel{
            position: relative;
            width: 100%;
            overflow: hidden;
            margin: auto;
         }
        #carousel-bks{
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .slide{
            min-width: 100%;
            height: 90vh;
            object-fit: cover;
        }
        #prev, #next{
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            border: none;
            font-size: 2rem;
            padding: 20px;
            cursor: pointer;
            z-index: 99;
        }
        #prev{
            left: 10px;
            background: none;
        }
        #next{
            right: 10px;
            background: none;
        }
    </style>
<body>
    <div class="nav">
        <div class="dlm">
            <div class="kanan">
                <p>Store.app</p>
            </div>
            <div class="kiri">
                <div class="sa">
                    <p>Home</p>
                </div>
                <div class="du">
                    <p>Product</p>
                </div>
                <div class="ti">
                    <p>Gallery</p>
                </div>
            </div>
        </div>
    </div>
    <div id="carousel">
        <button id="prev">⏮</button>

        <div id="carousel-bks">
            <img src="img/Screenshot 2025-10-28 074527.png" alt="banner 1" class="slide">
            <img src="img/Screenshot 2025-10-28 074618.png" alt="banner 2" class="slide">
            <img src="img/Screenshot 2025-10-28 074021.png" alt="banner 3" class="slide">
        </div>

        <button id="next">⏭</button>
    </div>

    <script>
        const slide = document.querySelectorAll('.slide')
        const bks = document.getElementById('carousel-bks')
        const nextBtn = document.getElementById('next')
        const prevBtn = document.getElementById('prev')

        let currentIndex = 0;

        function showSlide(index){
            bks.style.transform = `translateX(-${index * 100}%)`;
        }
        
        nextBtn.addEventListener('click', () =>{
            currentIndex = (currentIndex + 1) % slide.length;
            showSlide(currentIndex);
        });
        prevBtn.addEventListener('click', () =>{
            currentIndex = (currentIndex - 1 + slide.length) % slide.length;
            showSlide(currentIndex);
        })
    </script>
</body>
</html>
